<!DOCTYPE html>
<html lang="en">
<head>

    <title>NYC Hidden Gems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            height: 250px;
            object-fit: cover;
        }
    </style>
    <link rel="stylesheet" href="subStyle.css">
</head>
<body>
<div class="container my-5">
    <h1 class="text-center mb-4">Hidden Gems</h1>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow">
                <img src="images/highline.jpg" class="card-img-top" alt="The High Line">
                <div class="card-body">
                    <h5 class="card-title">The High Line</h5>
                    <p class="card-text">An elevated park built on a historic freight rail line, offering greenery and art in the middle of Manhattan.</p>
                </div>
            </div>
        </div>
        <!-- Add more gem cards here -->
    </div>
</div>
