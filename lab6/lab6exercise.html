<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab6 exercise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="row text-center">
    <h1 class="h3 text-primary">Workout plan</h1>
</div>
<div class="container border rounded">
    <div class="row border-bottom p-2">
        <div class="col-auto">
            <img src="activities/pushup.jpg" alt="push-ups" class="logo">
        </div>
        <div class="col-8">
            <div>
                <h1 class="h4 text-success">Push-Ups</h1>
                <p class="h6">Strengthen the chest, shoulders, and triceps</p>
            </div>
        </div>
        <div class="col-auto m-auto">
            <h1 class="h6 bg-success rounded p-1 text-light">Easy</h1>
        </div>
    </div>
    <div class="row border-bottom p-2">
        <div class="col-auto">
            <img src="activities/images.jpeg" alt="squats" class="logo rounded-circle">
        </div>
        <div class="col-8">
            <div>
                <h1 class="h4 text-warning">Squats</h1>
                <p class="h6">Great for lower body strength and flexibility.</p>
            </div>
        </div>
        <div class="col-auto m-auto">
            <h1 class="h6 p-1 bg-warning rounded text-light">Medium</h1>
        </div>
    </div>
    <div class="row p-2">
        <div class="col-auto">
            <img src="activities/burpee-3-1.jpg" alt="burpee" class="logo rounded">
        </div>
        <div class="col-8">
            <div>
                <h1 class="h4 text-danger">Push-Ups</h1>
                <p class="h6">Full body exercise, great for endurance.</p>
            </div>
        </div>
        <div class="col-auto m-auto">
            <h1 class="h6 bg-danger rounded p-1 text-light">Hard</h1>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
</body>
</html>
