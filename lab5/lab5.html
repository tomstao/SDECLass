<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab5 - animation and responsive webpage</title>
    <link rel="stylesheet" href="styleLab5.css">
</head>
<body>
    <h1>CSS animation</h1>
    <h2>CSS hover transition effect</h2>
    <div class="square_circle"></div>

    <h2>Zoom effect</h2>
    <section class="zoomcontainer">
        <img src="images/BrooklynBridge.png" alt="Brooklyn Bridge">
        <div class="zoomcontent">Surprise!</div>
    </section>

    <h2>Slide effect</h2>
    <section class="slidecontainer">
        <img src="images/BrooklynBridge.png" alt="Brooklyn Bridge">
        <div class="slidecontent">Surprise!</div>
    </section>

    <h2>Card effect</h2>
<section class="card">
    <img src="images/BrooklynBridge.png" alt="Brooklyn Bridge">
</section>

<section class="cardslide">
    <img src="images/BrooklynBridge.png" alt="Brooklyn Bridge">
</section>
</body>
</html>
